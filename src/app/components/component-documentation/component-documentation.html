<h1>Components</h1>
<hr>
   <app-card [iconClasses]="'fa-solid fa-circle-info'" [title]="'Quote'" [subTitle]="'Components'">
   <app-quote body [quote]="'Study Hard, Work Hard'"
   [author]="'Sai Shen Zin Mao'"
   [occupation]="'Software Engineer, Educator'">

   </app-quote>
</app-card>

  <app-card [iconClasses]="'fa-solid fa-circle-info'" [title]="'Model'" [subTitle]="'Components'">
   <div body>
    <app-modal [title]="'Modal Example'" #modal>
      <p>Some Content</p>
    </app-modal>
   </div>

   <div footer>
      <button (click)="modal.open()">Call Modal</button>
   </div>
</app-card>

 <app-card [iconClasses]="'fa-solid fa-circle-info'" [title]="'Top of Page'" [subTitle]="'Components'">
   <p body>Scroll down 400px down the page to render.</p>
</app-card>

<app-card [iconClasses]="'fas fa-info-circle'" [title]="'LinkedIn Post'" [subTitle]="'Components'">
  <app-linked-in-component body> </app-linked-in-component>
</app-card>

<app-card [iconClasses]="'fas fa-info-circle'" [title]="'Twitter Post'" [subTitle]="'Components'">
  <app-twitter-post-component body> </app-twitter-post-component>
</app-card>

<app-card [iconClasses]="'fas fa-info-circle'" [title]="'Loader'" [subTitle]="'Components'">
  <app-loader-component body [isLoading]="false" [loaderType]="loaderType"></app-loader-component>
</app-card>
  <app-card [iconClasses]="'fas fa-info-circle'" [title]="'Star Rating Component'" [subTitle]="'Components'">
    <app-star-rating body [rating]="4.75 "></app-star-rating>
  </app-card>
  <app-card [iconClasses]="'fas fa-info-circle'" [title]="'Progress bar'" [subTitle]="'Components'">
    <app-progress-bar body [value]="progressValue">

    </app-progress-bar>
    <button footer (click)="progressValue = 75;">Update Progress</button>
  </app-card>

  <app-card [iconClasses]="'fas fa-info-circle'" [title]="'Accordion'" [subTitle]="'Components'">
    <app-accordion body [items]="accordionItems">

    </app-accordion>
  </app-card>
  <app-card [iconClasses]="'fa-solid fa-circle-info'" [title]="'Card'" [subTitle]="'Components'">
  <p footer>Footer Content</p>
  <p body>Body Content</p>
</app-card>
